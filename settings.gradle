pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        mavenLocal()
        // Discord Social SDK 不公开发布到 Maven，只能从解密后的本地 AAR 解析。
        flatDir { dirs "$rootDir/core/libs" }
    }
}

rootProject.name = "Vela"
include ':phone'
include ':tv'
include ':shared'
include ':data'
include ':core'
