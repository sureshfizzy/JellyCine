plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.library' version '9.4.1' apply false
    id 'com.android.kotlin.multiplatform.library' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.20' apply false
    id 'com.google.dagger.hilt.android' version '2.60.1' apply false
    id 'com.google.devtools.ksp' version '2.3.12' apply false
    id 'org.jetbrains.compose' version '1.12.1' apply false
}

ext {
    appVersionCode = 26
    appVersionName = "1.3.6"
}

def libmpvIos = configurations.detachedConfiguration(
        dependencies.create('org.jellycine.mpv:libmpvios:1.0.0@zip'))

tasks.register('fetchLibmpvIos', Sync) {
    group = 'ios'
    from { zipTree(libmpvIos.singleFile) }
    into layout.buildDirectory.dir('libmpv-ios')
    doLast {
        file("$destinationDir/include").mkdirs()
        file("$destinationDir/include/module.modulemap").text = """module Mpv [system] {
    header "../libmpv-ios.xcframework/ios-arm64/Headers/client.h"
    export *
}
"""
    }
}
