name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          VELA_STORE_FILE_BASE64: ${{ secrets.VELA_STORE_FILE_BASE64 }}
        run: |
          if [ -z "$VELA_STORE_FILE_BASE64" ]; then
            echo "Missing GitHub secret VELA_STORE_FILE_BASE64"
            exit 1
          fi
          echo "$VELA_STORE_FILE_BASE64" | base64 --decode > vela-release.keystore

      - name: Decode Discord AAR
        env:
          DISCORD_PARTNER_SDK_AAR_BASE64: ${{ secrets.DISCORD_PARTNER_SDK_AAR_BASE64 }}
        run: |
          if [ -z "$DISCORD_PARTNER_SDK_AAR_BASE64" ]; then
            echo "DISCORD_PARTNER_SDK_AAR_BASE64 is not set; building without Discord Social SDK."
            exit 0
          fi
          mkdir -p core/libs
          echo "$DISCORD_PARTNER_SDK_AAR_BASE64" | base64 --decode > core/libs/discord_partner_sdk.aar
          if [ ! -s core/libs/discord_partner_sdk.aar ]; then
            echo "Decoded Discord AAR is empty. Check DISCORD_PARTNER_SDK_AAR_BASE64."
            exit 1
          fi

      - name: Assemble signed release
        env:
          VELA_STORE_FILE: ${{ github.workspace }}/vela-release.keystore
          VELA_STORE_PASSWORD: ${{ secrets.VELA_STORE_PASSWORD }}
          VELA_KEY_ALIAS: vela
          VELA_KEY_PASSWORD: ${{ secrets.VELA_KEY_PASSWORD }}
        run: ./gradlew :phone:assembleRelease :tv:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: vela-release
          path: |
            phone/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk
