
plugins {
    id 'com.android.library'
}

def discordAar = file('libs/discord_partner_sdk.aar')
def hasDiscordPrefab = false
if (discordAar.exists()) {
    def zip = new java.util.zip.ZipFile(discordAar)
    try {
        hasDiscordPrefab = zip.entries().any { it.name.startsWith('prefab/') }
    } finally {
        zip.close()
    }
}

android {
    namespace = 'com.vela.core'
    compileSdk = 37
    ndkVersion = "27.0.12077973"

    defaultConfig {
        minSdk = 27
        targetSdk = 36

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        if (hasDiscordPrefab) {
            externalNativeBuild {
                cmake {
                    cppFlags '-std=c++20'
                }
            }
        }
    }

    if (hasDiscordPrefab) {
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.19.0'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Media3 for player
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.0'
    implementation 'androidx.media3:media3-common:1.10.0'
    implementation 'androidx.media3:media3-datasource:1.10.1'
    implementation 'androidx.media3:media3-database:1.10.0'

    // Remote trailer URL extraction
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.github.MonseyNY:NewPipeExtractor:7ccf36f4'

    // Discord Social SDK
    implementation files('libs/discord_partner_sdk.aar')

    // Encrypted SharedPreferences for Discord auth tokens
    implementation 'androidx.security:security-crypto:1.1.0'

    // Hilt for dependency injection
    implementation 'com.google.dagger:hilt-android:2.60.1'

    // Data module dependency
    implementation project(':data')

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
