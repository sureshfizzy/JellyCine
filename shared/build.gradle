plugins {
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
}

def composeResourcesDir = layout.buildDirectory.dir('generated/composeResourcesSource')
def syncComposeResources = tasks.register('syncComposeResources', Sync) {
    from('src/androidMain/res') {
        include 'values*/strings.xml'
        include 'drawable/jellycine_logo.png'
        include 'drawable/ic_emby_placeholder.xml'
        include 'drawable/ic_jellyfin_placeholder.xml'
        include 'drawable/ic_dolby_logo.xml'
        include 'drawable/ic_dolby_atmos.xml'
        include 'drawable/ic_spatial_audio.xml'
        include 'drawable/ic_immersive_audio.xml'
        include 'drawable/ic_resume_playback.xml'
        include 'drawable/hdr_badge.png'
        include 'drawable/hdr10_badge.png'
        include 'drawable/hdr10plus_badge.png'
        include 'drawable/dolby_vision_badge.png'
    }
    from('../data/src/androidMain/res') {
        include 'values*/strings.xml'
        rename 'strings.xml', 'data_strings.xml'
        filter { line -> line.replace('name="', 'name="data_') }
    }
    into composeResourcesDir
}

compose.resources {
    publicResClass = true
    generateResClass = always
    packageOfResClass = "com.jellycine.resources"
    customDirectory(
        "commonMain",
        composeResourcesDir
    )
}

tasks.configureEach {
    if (name.endsWith('ValueResourcesForCommonMain')) {
        dependsOn syncComposeResources
    }
}

kotlin {
    android {
        namespace = 'com.jellycine.shared'
        compileSdk = 37
        minSdk = 27

        androidResources {
            enable = true
        }

        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        def iosArm64 = iosArm64()
        def iosSimulatorArm64 = iosSimulatorArm64()

        [iosArm64, iosSimulatorArm64].forEach { target ->
            target.binaries.framework {
                baseName = "JellyCineShared"
                isStatic = true
                export project(':data')
            }
        }
    }

    sourceSets {
        commonMain {
            kotlin.srcDir 'src/commonMain'
            dependencies {
                implementation project(':data')
                implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
                implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.material3
                implementation compose.ui
                implementation 'org.jetbrains.compose.ui:ui-tooling-preview:1.12.1'
                implementation 'org.jetbrains.compose.ui:ui-backhandler:1.12.1'
                implementation compose.components.resources
                implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
                implementation 'io.coil-kt.coil3:coil-network-core:3.6.3'
                implementation 'org.jetbrains.compose.material:material-icons-extended:1.7.3'
            }
        }
        androidMain {
            kotlin.srcDir 'src/androidMain'
            dependencies {
                implementation 'androidx.core:core-ktx:1.19.1'
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

                implementation dependencies.platform('androidx.compose:compose-bom:2026.09.00')
                implementation 'androidx.compose.ui:ui'
                implementation 'androidx.compose.ui:ui-graphics'
                implementation 'androidx.compose.ui:ui-tooling-preview'
                implementation 'androidx.compose.material3:material3'
                implementation 'androidx.compose.material:material-icons-extended'

                implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
                implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

                implementation 'androidx.datastore:datastore-preferences:1.2.1'

                implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
                implementation 'io.coil-kt.coil3:coil-network-core:3.6.3'
                implementation 'io.coil-kt.coil3:coil-gif:3.6.3'
                implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'
                implementation 'io.coil-kt.coil3:coil-svg:3.6.3'

                implementation 'com.google.dagger:hilt-android:2.60.1'
                implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'
            }
        }

        if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            iosMain {
                kotlin.srcDir 'src/iosMain'
                dependencies {
                    api project(':data')
                    implementation 'io.coil-kt.coil3:coil-network-ktor3:3.6.3'
                    implementation 'io.coil-kt.coil3:coil-svg:3.6.3'
                    implementation 'io.ktor:ktor-client-darwin:3.6.0'
                    implementation 'com.squareup.okio:okio:3.18.2'
                }
            }
        }
    }
}
