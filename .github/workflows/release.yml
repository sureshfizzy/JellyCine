name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check tag
        id: meta
        run: |
          VERSION=$(sed -n 's/.*appVersionName *= *"\([^"]*\)".*/\1/p' build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read appVersionName from build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match appVersionName ${VERSION} (expected v${VERSION})"
            exit 1
          fi

      - name: Build user-facing release notes
        id: notes
        run: |
          chmod +x scripts/release-notes.sh
          ./scripts/release-notes.sh --self-test
          ./scripts/release-notes.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --out "$RUNNER_TEMP/release-body.md"
          echo "body_path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
          echo "Release title: Vela v${{ steps.meta.outputs.version }}"
          echo "----- release body -----"
          cat "$RUNNER_TEMP/release-body.md"
          echo "------------------------"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check signing secrets
        env:
          VELA_STORE_FILE_BASE64: ${{ secrets.VELA_STORE_FILE_BASE64 }}
          VELA_STORE_PASSWORD: ${{ secrets.VELA_STORE_PASSWORD }}
          VELA_KEY_PASSWORD: ${{ secrets.VELA_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$VELA_STORE_FILE_BASE64" ] || missing+=("VELA_STORE_FILE_BASE64")
          [ -n "$VELA_STORE_PASSWORD" ] || missing+=("VELA_STORE_PASSWORD")
          [ -n "$VELA_KEY_PASSWORD" ] || missing+=("VELA_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub secret(s): ${missing[*]}"
            echo "Refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          VELA_STORE_FILE_BASE64: ${{ secrets.VELA_STORE_FILE_BASE64 }}
        run: echo "$VELA_STORE_FILE_BASE64" | base64 --decode > vela-release.keystore

      - name: Decrypt Discord Social SDK
        env:
          DISCORD_SDK_PASSPHRASE: ${{ secrets.DISCORD_SDK_PASSPHRASE }}
        run: |
          if [ -z "$DISCORD_SDK_PASSPHRASE" ]; then
            echo "Missing GitHub secret DISCORD_SDK_PASSPHRASE"
            exit 1
          fi

          mkdir -p core/libs
          # 完整 SDK 超过 GitHub Secret 大小限制，只在 runner 内使用密钥解密。
          gpg --quiet --batch --yes \
            --passphrase "$DISCORD_SDK_PASSPHRASE" \
            --output core/libs/discord_partner_sdk.aar \
            --decrypt core/libs/discord_partner_sdk.aar.gpg

          echo "a2ea010b8ac26732b63c8345b6eeb711f990f151eaa1b33c6141319ead91dea9  core/libs/discord_partner_sdk.aar" | sha256sum --check
          unzip -t core/libs/discord_partner_sdk.aar
          if ! unzip -Z1 core/libs/discord_partner_sdk.aar | grep '^prefab/' > /dev/null; then
            echo "Discord AAR does not contain Prefab native libraries"
            exit 1
          fi

      - name: Assemble signed release
        env:
          VELA_STORE_FILE: ${{ github.workspace }}/vela-release.keystore
          VELA_STORE_PASSWORD: ${{ secrets.VELA_STORE_PASSWORD }}
          VELA_KEY_ALIAS: vela
          VELA_KEY_PASSWORD: ${{ secrets.VELA_KEY_PASSWORD }}
        run: ./gradlew :phone:assembleRelease :tv:assembleRelease

      - name: Verify APKs are signed
        run: |
          shopt -s nullglob
          apks=(phone/build/outputs/apk/release/*.apk tv/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APKs found"
            exit 1
          fi

          signer=""
          for dir in "${ANDROID_SDK_ROOT:-}"/build-tools/* "${ANDROID_HOME:-}"/build-tools/*; do
            if [ -x "$dir/apksigner" ]; then
              signer="$dir/apksigner"
            fi
          done
          if [ -z "$signer" ]; then
            echo "apksigner not found"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "verifying $apk"
            "$signer" verify --print-certs "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vela-release
          path: |
            phone/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Vela v${{ steps.meta.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            phone/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk
