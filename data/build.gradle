plugins {
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

kotlin {
    android {
        namespace = 'com.jellycine.data'
        compileSdk = 36
        minSdk = 27

        androidResources {
            enable = true
        }

        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }

        optimization {
            consumerKeepRules.publish = true
            consumerKeepRules.file("consumer-rules.pro")
        }
    }

    jvm("desktop") {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    // iOS targets
    def iosX64 = iosX64()
    def iosArm64 = iosArm64()
    def iosSimulatorArm64 = iosSimulatorArm64()

    // Configure iOS framework for Xcode
    [iosX64, iosArm64, iosSimulatorArm64].forEach { target ->
        target.binaries.framework {
            baseName = "JellyCineData"
            isStatic = true
        }
    }

    sourceSets {
        commonMain {
            kotlin.srcDirs = ['src/commonMain']
            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
                implementation "io.ktor:ktor-client-core:3.5.2"
                implementation "io.ktor:ktor-client-content-negotiation:3.5.2"
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
            }
        }
        androidMain {
            kotlin.srcDirs = ['src/androidMain']
            dependencies {
                implementation 'androidx.core:core-ktx:1.19.0'
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
                implementation "io.ktor:ktor-client-okhttp:3.5.2"
                implementation "io.ktor:ktor-serialization-kotlinx-json:3.5.2"
                implementation 'androidx.datastore:datastore-preferences:1.2.1'
                implementation 'androidx.security:security-crypto:1.1.0'
            }
        }
        desktopMain {
            kotlin.srcDirs = ['src/desktopMain']
            dependencies {
                implementation "io.ktor:ktor-client-okhttp:3.5.2"
                implementation "io.ktor:ktor-serialization-kotlinx-json:3.5.2"
            }
        }
        iosMain {
            kotlin.srcDirs = ['src/iosMain']
            dependencies {
                implementation "io.ktor:ktor-client-darwin:3.5.2"
                implementation "io.ktor:ktor-serialization-kotlinx-json:3.5.2"
                implementation "androidx.datastore:datastore-preferences-core:1.2.1"
                implementation "com.squareup.okio:okio:3.9.0"
            }
        }
    }
}

// XCFramework configuration for iOS
tasks.register('assembleXCFramework', Exec) {
    dependsOn 'linkDebugFrameworkIosArm64'
    dependsOn 'linkDebugFrameworkIosSimulatorArm64'

    def frameworkPath = "JellyCineData.framework"
    def xcframeworkPath = "${buildDir}/XCFrameworks/debug/JellyCineData.xcframework"

    doFirst {
        delete xcframeworkPath
    }

    commandLine 'xcodebuild', '-create-xcframework',
        '-framework', "${buildDir}/bin/iosArm64/debugFramework/${frameworkPath}",
        '-framework', "${buildDir}/bin/iosSimulatorArm64/debugFramework/${frameworkPath}",
        '-output', xcframeworkPath
}

tasks.register('copyFrameworkToIosApp', Copy) {
    dependsOn 'assembleXCFramework'

    from("${buildDir}/XCFrameworks/debug") {
        include "JellyCineData.xcframework/**"
    }
    into "${rootDir}/iosApp/Frameworks"
}